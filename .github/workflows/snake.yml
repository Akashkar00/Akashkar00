name: Generate Snake

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Akashkar00
          # The first colour in each color_dots list is the EMPTY contribution cell.
          # Dark uses the visible slate #2d3343 deliberately — against GitHub's #0d1117
          # a near-black empty cell disappears and the grid looks broken.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%232d3343,%233b2f6b,%235b45a8,%238a6fe0,%23A78BFA
            dist/snake-light.svg?palette=github-light&color_snake=%230891B2&color_dots=%23ebedf0,%23d8ccf7,%23b69df0,%239370e6,%237C3AED

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
